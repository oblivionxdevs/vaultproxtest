<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault</title>
    
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv/uv.config.js" defer></script>
    <script src="/register-sw.js" defer></script>
    <script src="/search.js" defer></script>
    <script src="/index.js" defer></script>
    <script src="/error.js" defer></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap");
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        .black{
            position:absolute;
            left:0px;
            opacity:1;
            display:block;
            top:0px;
            width:100%;
            z-index:100;
            height:100%;
            background: #000;
        }
        .loadimg{
            position:absolute;
            opacity:1;
            display:block;
            width:125px;
            z-index:101;
            height:125px;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            color: #FFFFFF;
        }
        @keyframes fadeout{
            0%{
                opacity:1;
                pointer-events: none;
            }
            100%{
                opacity:0;
                display:none;
            }
        }
        .bg{
            top: 0%;
            left: 0%;
            position: absolute;
            width:100%;
            height:100%;
        }
        .credits{
            z-index:100;
            position: absolute;
            left:5px;
            bottom:5px;
            text-align: center;
            color: #FFFFFF;
            cursor: pointer;
        }
        .creditstext{
            color: blue;
        }
        .searchbox{
            width:47%;
            height:7%;
            color: #FFFFFF;
            position: absolute;
            left:26.5%;
            top:50%;
            z-index: 10;
        }
        .settings{
            position: absolute;
            left:1%;
            top:1%;
            opacity:1;
            color: #FFFFFF;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .search{
            text-align: center;
            border-radius: 18px;
            outline:none;
            background:transparent;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            width:100%;
            height:100%;
        }
        .title{
            position: absolute;
            width: 100%;
            height: 100px;
            top:19%;
            text-shadow: 3px 6px 2px #c4c4c4;
            text-align: center;
            color: #FFFFFF;
        }
        ::placeholder {
            margin: auto;
            color: #FFFFFF;
            font-size: 1.2em;
        }
        .icons{
            display: flex;
            justify-content: center;
            gap: 60px;
            position: absolute;
            width: 100%;
            bottom: 40px;
            left: 0%;
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px;
        }
        .labels{
            color: white;
            font-size: 14px;
            text-align: center;
            margin-top: 4px;
        }
        #settingslabel{
            position: absolute;
            left: 1%;
            top: calc(1% + 50px);
            padding-left: 10px;
        }
        .settings:hover, .icon-btn:hover{
            border-radius:25px;
            filter: blur(1px);
            box-shadow: 0px 0px 109px 20px rgba(255,255,255,1);
            background-color: rgb(230, 230, 230,0.4);
        }
        .settings, .icon-btn{
            transition: border-radius 0.8s ease-out, filter 0.7s ease-out, box-shadow 0.7s ease-out, background-color 0.5s ease-out;
        }
    </style>
</head>
<body>

    <div id="black" class="black"></div>
    <div id="loadimg" class="loadimg">
        <i data-lucide="loader-2" style="width: 125px; height: 125px; animation: spin 2s linear infinite;"></i>
    </div>
    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <div id="particlebox" class="bg"></div>
    <script src="/scripts/bg.js"></script>

    <button class="settings" onclick="location.href='/settings.html'" aria-label="Settings">
        <i data-lucide="settings" style="width: 32px; height: 32px;"></i>
    </button>
    <div id="settingslabel" class="labels">Settings</div>

    <div class="title">
        <h1 id="title1">The Vault</h1>
    </div>

    <form class="searchbox" id="searchbox">
        <input id="searchengine" value="" type="hidden"/>
        <input class="search" id="search" placeholder='Search the web freely' type='text' autocomplete="off"/>
    </form>

    <div class="icons">
        <button class="icon-btn" onclick="location.href='/discord.html'">
            <i data-lucide="message-square" style="width: 36px; height: 36px;"></i>
            <span class="labels">Discord</span>
        </button>
        <button class="icon-btn" onclick="location.href='/github.html'">
            <i data-lucide="github" style="width: 36px; height: 36px;"></i>
            <span class="labels">GitHub</span>
        </button>
        <button class="icon-btn" onclick="blank()">
            <i data-lucide="shield-alert" style="width: 36px; height: 36px;"></i>
            <span class="labels">About Blank</span>
        </button>
    </div>

    <div class="credits" onclick="gotocredits()">
        Powered by <span class="creditstext">The Vault</span>
    </div>

    <script>
        // Initialize lucide icon markup replacement rules
        lucide.createIcons();

        function get_cookie(cookie_name) { 
            const value = "; " + document.cookie; 
            const parts = value.split("; " + cookie_name + "="); 
            if (parts.length === 2) return parts.pop().split(";").shift(); 
        } 

        function blank(){
            (function () {
                var url = document.URL; 
                win = window.open(); 
                win.document.body.style.margin = "0"; 
                win.document.body.style.height = "100vh"; 
                var iframe = win.document.createElement("iframe"); 
                iframe.style.border = "none"; 
                iframe.style.width = "100%"; 
                iframe.style.height = "100%"; 
                iframe.style.margin = "0"; 
                iframe.referrerPolicy = "no-referrer"; 
                iframe.allow = "fullscreen"; 
                iframe.src = url.toString(); 
                win.document.body.appendChild(iframe);
                window.location.href="https://google.com";
            })();
        }

        function gotocredits(){
            window.location.href = window.location.origin + "/credits";
        }

        // Handle auto-tab cloaking rules
        if (get_cookie("autoblank") === "on"){
            if (window.top !== window) {
                var title2 = get_cookie("title2") || "The Vault";
                var favicon = get_cookie("favicon") || "https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://google.com&size=16";
                
                var link = parent.document.createElement('link');
                link.type = 'image/x-icon';
                link.rel = 'shortcut icon';
                link.href = favicon;
                parent.document.getElementsByTagName('head')[0].appendChild(link);
                parent.document.title = title2;
            } else {
                blank();
            }
        }
        
        // Handle normal Favicon and Cloaking Titles
        var title2 = get_cookie("title2") || "The Vault";
        var favicon = get_cookie("favicon") || "https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://google.com&size=16";
        document.title = title2;
        
        var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.type = 'image/x-icon';
        link.rel = 'shortcut icon';
        link.href = favicon;
        document.getElementsByTagName('head')[0].appendChild(link);

        // Adjust font rules across viewports
        var title1 = document.getElementById("title1");
        var search = document.getElementById("search");
        var fontsize1 = 2560 / screen.width * 18;
        var fontsize2 = 2560 / screen.width * 7.5;
        if(title1) title1.style.fontSize = fontsize1 + "px";
        if(search) search.style.fontSize = fontsize2 + "px";

        // Setup Selected Search Engine Prefixes
        var browsertype = get_cookie("browser3") || "google";
        var searchengine = document.getElementById("searchengine");
        
        if (browsertype === "google") {
            searchengine.value = "https://www.google.com/search?q=%s";
        } else if (browsertype === "bing") {
            searchengine.value = "https://www.bing.com/search?q=%s";
        } else if (browsertype === "yahoo") {
            searchengine.value = "https://search.yahoo.com/search?p=%s";
        }

        // Splash Loader Animation Sequence
        function fade(){
            var loadImgElement = document.getElementById("loadimg");
            var blackOverlayElement = document.getElementById("black");
            
            if(loadImgElement) {
                loadImgElement.style.animation = "linear 1.5s 1 running fadeout";
                loadImgElement.addEventListener("animationend", () => {
                    if(blackOverlayElement) {
                        blackOverlayElement.style.animation = "linear 1.5s 1 running fadeout";
                        blackOverlayElement.addEventListener("animationend", () => {
                            blackOverlayElement.remove();
                        });
                    }
                    loadImgElement.remove();
                });
            }
        }
        setTimeout(fade, 1200);
    </script>
</body>
</html>
